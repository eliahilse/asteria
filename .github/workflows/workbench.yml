name: Research workbench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: Verify evidence and experiment runner
        run: python3 -m unittest discover -s research -p 'test_*.py' -v
      - name: Validate security controls on this environment
        run: python3 -m research.evaluate_security --controls-only --output "$RUNNER_TEMP/security-controls.json"
      - name: Validate large-record adapter preconditions
        run: python3 -m research.amplification_audit --calibrate --output "$RUNNER_TEMP/amplification-calibration"
      - name: Install workbench dependencies
        working-directory: workbench
        run: npm ci
      - name: Build static research workbench
        working-directory: workbench
        run: npm run build
      - name: Verify analysis and exact XLSX export
        working-directory: workbench
        run: npm test
      - name: Install test browser
        working-directory: workbench
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows
        working-directory: workbench
        run: npm run test:e2e
      - name: Calibrate original functional suites with a graphical runtime
        run: |
          xvfb-run -a python3 -m research.evaluate_response --response experiments/vamos_security_pilot/results/raw_responses/gpt-5.4-mini_none__generation_s__r1.txt --output "$RUNNER_TEMP/functional-calibration"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'functional-calibration/report.json').read_text())
          assert report['status'] == 'evaluated', report.get('error')
          if report['functionalSuccess'] is not True:
              print(json.dumps(report.get('authorResults', {}), indent=2))
              for call in report.get('processes', []):
                  if call['exitCode'] != 0:
                      print(call['command'][0], call['exitCode'], (call['stderr'] or '')[-8000:])
          assert report['functionalSuccess'] is True, report['checks']
          assert len(report['checks']) == 16
          assert sum(c['status'] == 'pass' for c in report['security']['checks']) == 5
          assert report['jointSuccess'] is False
          print('Reference reproduced: 16/16 functional, 5/11 security; no new model attempt.')
          PY
      - name: Calibrate isolated JVM homes and integrated security classpath
        run: |
          xvfb-run -a python3 -m research.evaluate_integrated --response experiments/vamos_security_pilot/results/raw_responses/gpt-5.4-mini_none__generation_s__r1.txt --output "$RUNNER_TEMP/isolated-calibration"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'isolated-calibration/report.json').read_text())
          assert report['functionalSuccess'] is True, report['checks']
          assert len(report['checks']) == 16
          assert sum(c['status'] == 'pass' for c in report['security']['checks']) == 5
          assert report['security']['linkage']['compiledClasses']
          assert report['security']['linkage']['probeCompilation']['exitCode'] == 0
          homes = [jvm['home'] for jvm in report['isolatedJvms']]
          assert homes and len(homes) == len(set(homes))
          assert all(not Path(home).exists() for home in homes)
          print('Isolated reference reproduced: 16/16 functional, 5/11 security; all JVM homes unique and removed.')
          PY
      - name: Upload static Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: workbench/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
